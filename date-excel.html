<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Wallpaper — Shortcuts</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent2:      #41b883;
            --bg-dark:      #0d1117;
            --glass-bg:     rgba(255,255,255,0.045);
            --glass-border: rgba(255,255,255,0.09);
            --text:         #e6edf3;
            --muted:        #8b949e;
            /* per-mode accent — changed by JS */
            --mode-a:       #1a5e38;
            --mode-b:       #217346;
            --mode-glow:    rgba(33,115,70,0.14);
            --mode-shadow:  rgba(33,115,70,0.45);
        }

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 70% at 85% 50%, var(--mode-glow) 0%, transparent 70%),
                linear-gradient(160deg, #0d1117 0%, #0f1b25 100%);
            z-index: 0;
            transition: background 0.4s ease;
        }

        /* ── Right column ── */
        .right-col {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 38%;
            min-width: 500px;
            max-width: 680px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 1.4rem 1.4rem 1.4rem 1.2rem;
        }

        /* ── Clock strip ── */
        .clock-strip {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 1.4rem;
            padding: 0.75rem 1.2rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px 14px 0 0;
            border-bottom: 1px solid rgba(65,184,131,0.15);
            backdrop-filter: blur(16px);
            box-shadow: 0 -2px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
        }

        /* badge wrapper for tooltip */
        .badge-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .badge-wrap::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 7px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ccc;
            font-size: 0.55rem;
            white-space: nowrap;
            padding: 3px 8px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .badge-wrap:hover::after { opacity: 1; }

        .app-badge {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--mode-a), var(--mode-b));
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 3px 10px var(--mode-shadow);
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.3s ease;
        }
        .app-badge:hover  { transform: scale(1.12); }
        .app-badge:active { transform: scale(0.93); }

        #clock {
            font-size: 2.4rem;
            font-weight: 200;
            letter-spacing: -1.5px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 40px rgba(65,184,131,0.25);
            flex-shrink: 0;
        }

        .date-block {
            display: flex;
            flex-direction: column;
            gap: 1px;
            border-left: 1px solid rgba(255,255,255,0.08);
            padding-left: 1.2rem;
            flex: 1;
        }

        .date-greg {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
            opacity: 0.9;
        }
        .date-hijri {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--muted);
        }

        /* mode label (top-right of strip) */
        .mode-label {
            margin-left: auto;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent2);
            opacity: 0.7;
            white-space: nowrap;
            transition: color 0.3s;
        }

        /* ── Shortcuts panel ── */
        .shortcuts-panel {
            flex: 1;
            overflow-y: auto;
            padding: 0.9rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: none;
            border-radius: 0 0 14px 14px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 -1px 0 rgba(255,255,255,0.04);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .shortcuts-panel::-webkit-scrollbar       { width: 3px; }
        .shortcuts-panel::-webkit-scrollbar-track { background: transparent; }
        .shortcuts-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

        .all-categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1.2rem;
            transition: opacity 0.18s ease;
        }
        .all-categories.fading { opacity: 0; }

        .category { margin-bottom: 0.7rem; }

        .category-title {
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent2);
            padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(65,184,131,0.2);
            margin-bottom: 0.3rem;
            transition: color 0.3s, border-color 0.3s;
        }

        .shortcut-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.18rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .shortcut-desc {
            font-size: 0.7rem;
            color: var(--muted);
            flex: 1;
            padding-right: 0.4rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .keys {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1px 5px;
            min-width: 20px;
            height: 18px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.14);
            border-bottom-width: 2px;
            border-radius: 4px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .plus { font-size: 0.55rem; color: var(--muted); margin: 0 1px; }

        .footer-note {
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 0.58rem;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.04em;
        }
    </style>
</head>

                ]},
                { title: 'Bookmarks & History', rows: [
                    ['Bookmark this tab',        [['Ctrl'],'+',['D']]],
                    ['Bookmark all tabs',        [['Ctrl'],'+',['Shift'],'+',['D']]],
                    ['Open Bookmarks manager',   [['Ctrl'],'+',['Shift'],'+',['O']]],
                    ['Show bookmarks bar',       [['Ctrl'],'+',['Shift'],'+',['B']]],
                    ['Open History',             [['Ctrl'],'+',['H']]],
                    ['Open Downloads',           [['Ctrl'],'+',['J']]],
                    ['Clear browsing data',      [['Ctrl'],'+',['Shift'],'+',['Delete']]],
                ]},
                { title: 'Developer & More', rows: [
                    ['Open DevTools',            [['F12']]],
                    ['Inspect element',          [['Ctrl'],'+',['Shift'],'+',['I']]],
                    ['JavaScript console',       [['Ctrl'],'+',['Shift'],'+',['J']]],
                    ['View page source',         [['Ctrl'],'+',['U']]],
                    ['Save page as',             [['Ctrl'],'+',['S']]],
                    ['Print page',               [['Ctrl'],'+',['P']]],
                    ['Open Settings',            [['Alt'],'+',['E']]],
                    ['Open Task Manager',        [['Shift'],'+',['Esc']]],
                    ['Focus next pane',          [['F6']]],
                    ['Caret browsing toggle',    [['F7']]],
                ]},
            ]
        }
    ];

    /* ═══════════════════════════════════════════════════
       RENDER ENGINE
    ═══════════════════════════════════════════════════ */
    let currentMode = 0;
    const grid       = document.getElementById('grid');
    const badge      = document.getElementById('badge');
    const modeLabel  = document.getElementById('modeLabel');
    const footerNote = document.getElementById('footerNote');

    function keysHTML(keyDef) {
        return keyDef.map(part => {
            if (Array.isArray(part)) return `<kbd>${part[0]}</kbd>`;
            return `<span class="plus">${part}</span>`;
        }).join('');
    }

    function renderMode(idx) {
        const m = MODES[idx];

        // fade out
        grid.classList.add('fading');
        setTimeout(() => {
            // update badge & colors
            badge.textContent = m.icon;
            modeLabel.textContent = m.label;
            footerNote.textContent = m.footer;

            document.documentElement.style.setProperty('--mode-a',      m.colorA);
            document.documentElement.style.setProperty('--mode-b',      m.colorB);
            document.documentElement.style.setProperty('--mode-glow',   m.glow);
            document.documentElement.style.setProperty('--mode-shadow', m.shadow);
            document.documentElement.style.setProperty('--accent2',     m.accent);
            badge.style.background = `linear-gradient(135deg, ${m.colorA}, ${m.colorB})`;
            badge.style.boxShadow  = `0 3px 10px ${m.shadow}`;
            modeLabel.style.color  = m.accent;

            // rebuild grid
            grid.innerHTML = m.categories.map(cat => `
                <div class="category">
                    <div class="category-title">${cat.title}</div>
                    ${cat.rows.map(([desc, keys]) => `
                        <div class="shortcut-row">
                            <span class="shortcut-desc">${desc}</span>
                            <span class="keys">${keysHTML(keys)}</span>
                        </div>`).join('')}
                </div>`).join('');

            // fade in
            grid.classList.remove('fading');
        }, 180);
    }

    // Click to cycle
    badge.addEventListener('click', () => {
        currentMode = (currentMode + 1) % MODES.length;
        renderMode(currentMode);
    });

    // Initial render
    renderMode(0);

    /* ═══════════════════════════════════════════════════
       CLOCK
    ═══════════════════════════════════════════════════ */
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString([], {
            hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('gregorian').innerText =
            `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`;

        const hijriParts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', {
            day: 'numeric', month: 'numeric', year: 'numeric'
        }).formatToParts(now);
        const hY = hijriParts.find(p => p.type === 'year')?.value  ?? '----';
        const hM = hijriParts.find(p => p.type === 'month')?.value ?? '--';
        const hD = hijriParts.find(p => p.type === 'day')?.value   ?? '--';
        document.getElementById('hijri').innerText = `${hY}/${pad(hM)}/${pad(hD)}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
    </script>
</body>
</html>
