<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Date Wallpaper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Dark, neutral background */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            /* Fixed width prevents the box from resizing when numbers change */
            width: 600px;
            padding: 3rem 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #clock {
            font-size: 6rem;
            font-weight: 200;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            /* This makes numbers "monospaced" so they don't jump around */
            font-variant-numeric: tabular-nums;
        }

        .date-row {
            font-size: 1.5rem;
            opacity: 0.8;
            margin: 0.5rem 0;
            font-weight: 400;
            color: white; /* Hijri and Gregorian now match */
        }

        .divider {
            width: 50px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            margin: 1.5rem auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="clock">00:00:00</div>
        <div class="date-row" id="gregorian">Loading...</div>
        <div class="divider"></div>
        <div class="date-row" id="hijri">Loading...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // 1. Time (HH:MM:SS)
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { 
                hour12: true, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });

            // 2. Gregorian Date
            const gregOptions = { day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('gregorian').innerText = now.toLocaleDateString('en-GB', gregOptions);

            // 3. Hijri Date (Umm al-Qura)
            const hijriOptions = { day: 'numeric', month: 'long', year: 'numeric' };
            const hijriDate = now.toLocaleDateString('en-u-ca-islamic-umalqura-nu-latn', hijriOptions);
            document.getElementById('hijri').innerText = hijriDate + " AH";
        }

        // Update every second
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
